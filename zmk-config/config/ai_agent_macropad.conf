# Layered on top of Keychron's own keychron_q3_ultra_ansi.conf and
# zzeneg/zmk-raw-hid's raw_hid_adapter.conf via EXTRA_CONF_FILE (see
# ../build.yaml) -- additive, so it does NOT replace Keychron's own
# defaults (USB VID/PID, BLE settings, RGB driver, etc). Do not rename
# this to keychron_q3_ultra_ansi.conf: a same-named file in this repo's
# config/ would be used INSTEAD OF the shield-bundled one, not merged
# with it, silently dropping everything Keychron's default provides.

# Keychron's shield conf sets this =y for their CKLED2001 RGB driver's
# SPI interface, but the symbols that would normally auto-select its
# dependencies (SPI, SPI_RTL87X2G) are part of the same missing
# RGB-enable Kconfig chain as CKLED2001 itself (see zmk-module/Kconfig)
# -- unsatisfied-dependency warnings are just as fatal to this build as
# undefined-symbol ones. Phase 1 doesn't use RGB/SPI at all, so this is
# turned off rather than stubbed further.
CONFIG_SPI_RTL87X2G_DMA=n

CONFIG_RAW_HID=y

# Keychron's shield conf already sets CONFIG_USB_HID_DEVICE_COUNT=3
# for its own boot/consumer/keyboard HID interfaces; raw_hid_adapter's
# own conf separately sets it to 2 (assuming a stock 1-interface
# board). Neither is right once both are combined -- 3 existing + 1
# new raw-HID interface -- so it's pinned explicitly here rather than
# relying on whichever fragment's value wins the merge.
CONFIG_USB_HID_DEVICE_COUNT=4

CONFIG_AI_AGENT_MACROPAD_HID=y
